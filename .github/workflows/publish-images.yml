name: Publish Pre-Built OpenRig Images (Multi-Arch)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile:
          - role: fullstack
            py: "true"
            jvm: "true"
            node: "true"
            mob: "false"
            sec: "true"
          - role: backend-python
            py: "true"
            jvm: "false"
            node: "false"
            mob: "false"
            sec: "false"
          - role: backend-jvm
            py: "false"
            jvm: "true"
            node: "false"
            mob: "false"
            sec: "false"
          - role: sec-devops
            py: "true"
            jvm: "false"
            node: "false"
            mob: "false"
            sec: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 + AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push openrig:${{ matrix.profile.role }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.profile.role }}
          build-args: |
            INSTALL_PYTHON=${{ matrix.profile.py }}
            INSTALL_JVM=${{ matrix.profile.jvm }}
            INSTALL_NODE=${{ matrix.profile.node }}
            INSTALL_MOBILE=${{ matrix.profile.mob }}
            INSTALL_SEC=${{ matrix.profile.sec }}
            INSTALL_CLOUD=true
            INSTALL_AI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
