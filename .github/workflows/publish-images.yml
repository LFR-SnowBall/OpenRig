name: Publish Pre-Built OpenRig Images (Multi-Arch)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lfr-snowball/openrig

jobs:
  build-arch:
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
        profile:
          - role: fullstack
            py: "true"
            jvm: "true"
            node: "true"
            mob: "false"
            sec: "true"
          - role: backend-python
            py: "true"
            jvm: "false"
            node: "false"
            mob: "false"
            sec: "false"
          - role: backend-jvm
            py: "false"
            jvm: "true"
            node: "false"
            mob: "false"
            sec: "false"
          - role: frontend
            py: "false"
            jvm: "false"
            node: "true"
            mob: "false"
            sec: "false"
          - role: sec-devops
            py: "true"
            jvm: "false"
            node: "false"
            mob: "false"
            sec: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.profile.role }} (${{ matrix.arch.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.profile.role }}-${{ matrix.arch.suffix }}
          build-args: |
            INSTALL_PYTHON=${{ matrix.profile.py }}
            INSTALL_JVM=${{ matrix.profile.jvm }}
            INSTALL_NODE=${{ matrix.profile.node }}
            INSTALL_MOBILE=${{ matrix.profile.mob }}
            INSTALL_SEC=${{ matrix.profile.sec }}
            INSTALL_CLOUD=true
            INSTALL_AI=true
          cache-from: type=gha,scope=${{ matrix.profile.role }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile.role }}-${{ matrix.arch.suffix }}

  merge-manifests:
    needs: build-arch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role: [fullstack, backend-python, backend-jvm, frontend, sec-devops]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for ${{ matrix.role }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.role }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.role }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.role }}-arm64
